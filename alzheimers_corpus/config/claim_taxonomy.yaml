# Alzheimer's claim taxonomy. GENERATED from
# configs/taxonomy/claim_classes_v0.draft.json - edit that file, then regenerate.
# `keywords` are intentionally EMPTY: populating them is assignment-mechanism work,
# gated on taxonomy approval (docs/STAGE_1_CLAIM_CLASS_TAXONOMY.md, decisions E1-E6).
version: 0.1.0
updated: '2026-09-11'
taxonomy_id: AD-CLAIM-CLASS
status: PROPOSED - requires human approval before any assignment mechanism is built
derived_from: MS_Thesis_Proposal.pdf 5.1 (11 named topics); granularity rule from 4.4 contested test and
  4.3 gamma
granularity_rule: A class must be fine enough that two passages sharing it make claims about the SAME
  clinical decision, and coarse enough that an update and the thing it updates share one class.
multi_label: true
multi_label_note: K(s) in the proposal is plural - a passage may carry several classes. Single- vs multi-label
  remains REQUIRES HUMAN DECISION (E3).
classification_is_not_a_delete_filter: true
classification_note: 'Claim class supports retrieval ranking, down-weighting, filtering and manual review.
  It MUST NOT delete documents: gamma down-weights rather than deletes precisely because tagging precision
  is unverified.'
open_decisions:
- granularity level
- whether 40-80 is binding
- multi-label vs single-label
- psi(q) time-invariance flag per class
- scope of prevention/comorbidity/care
explicitly_not_defined:
- source tier / authority ordering - would prejudge ablation A12
counts:
  groups: 9
  classes: 50
  REQUIRED: 40
  DESIRABLE: 10
