# Alzheimer's-specific controlled vocabulary. Versioned and extensible.
# `anchor: true` groups establish AD relevance on their own. Everything else is
# a supporting concept and must co-occur with an anchor (see corpus_config.yaml).
# Biomedical surface forms are preserved EXACTLY - normalization must not fold
# Abeta42/p-tau217/ARIA-E/APOE e4 (see scripts/normalization rules).
version: "0.1.0"
updated: "2026-09-11"

groups:

  disease_terminology:
    anchor: true
    terms:
      - "Alzheimer disease"
      - "Alzheimer's disease"
      - "Alzheimer’s disease"       # U+2019, the form PubMed often carries
      - "Alzheimer dementia"
      - "Alzheimer's dementia"
      - "Alzheimer disease dementia"
      - "Alzheimer-type dementia"
      - "dementia of the Alzheimer type"
      - "senile dementia of the Alzheimer type"
    abbreviations:
      # Case-sensitive and word-bounded: "AD" is highly ambiguous in biomedical
      # text (e.g. atopic dermatitis, autosomal dominant). Never matched alone -
      # requires a same-document long-form hit. Enforced in ad_relevance.py.
      - token: "AD"
        requires_longform_in_document: true
      - token: "SDAT"
        requires_longform_in_document: false
      - token: "ADRD"
        requires_longform_in_document: false

  clinical_stages:
    anchor: false
    terms:
      - "preclinical Alzheimer's disease"
      - "subjective cognitive decline"
      - "mild cognitive impairment"
      - "MCI due to Alzheimer's disease"
      - "mild Alzheimer's dementia"
      - "moderate Alzheimer's dementia"
      - "severe Alzheimer's dementia"
      - "prodromal Alzheimer's disease"

  pathology:
    anchor: false
    terms:
      - "amyloid beta"
      - "Aβ"
      - "Abeta"
      - "Aβ40"
      - "Aβ42"
      - "amyloid plaques"
      - "tau"
      - "phosphorylated tau"
      - "p-tau"
      - "p-tau181"
      - "p-tau217"
      - "p-tau231"
      - "neurofibrillary tangles"

  biomarkers:
    anchor: false
    terms:
      - "CSF biomarkers"
      - "plasma biomarkers"
      - "blood biomarkers"
      - "amyloid biomarkers"
      - "tau biomarkers"
      - "neurofilament light"
      - "NfL"
      - "GFAP"
      - "amyloid PET"
      - "tau PET"
      - "MRI"
      - "FDG-PET"

  genetics:
    anchor: false
    terms:
      - "APOE"
      - "APOE ε4"
      - "APOE e4"
      - "APOE4"
      - "familial Alzheimer's disease"
      - "autosomal dominant Alzheimer's disease"
      - "genetic risk"

  diagnosis:
    anchor: false
    terms:
      - "diagnostic criteria"
      - "clinical diagnosis"
      - "cognitive assessment"
      - "neuropsychological testing"
      - "differential diagnosis"
      - "biomarker-supported diagnosis"
      - "staging"
      - "NIA-AA"
      - "IWG"
      - "NINCDS-ADRDA"

  treatment:
    anchor: false
    terms:
      - "cholinesterase inhibitors"
      - "donepezil"
      - "rivastigmine"
      - "galantamine"
      - "memantine"
      - "anti-amyloid therapy"
      - "disease-modifying therapy"
      - "monoclonal antibody therapy"
      - "lecanemab"
      - "donanemab"
      - "aducanumab"

  safety:
    anchor: false
    terms:
      - "ARIA"
      - "ARIA-E"
      - "ARIA-H"
      - "amyloid-related imaging abnormalities"
      - "adverse events"
      - "contraindications"
      - "monitoring"

  disease_course:
    anchor: false
    terms:
      - "progression"
      - "prognosis"
      - "severity"
      - "functional decline"
      - "behavioral symptoms"
      - "behavioural symptoms"

  risk_and_prevention:
    anchor: false
    terms:
      - "risk factors"
      - "vascular risk"
      - "prevention"
      - "lifestyle"
      - "physical activity"
      - "cognitive activity"

# Surface forms that normalization MUST NOT alter (case, diacritics, hyphens).
preserve_verbatim:
  - "Aβ42"
  - "Aβ40"
  - "Aβ"
  - "p-tau181"
  - "p-tau217"
  - "p-tau231"
  - "ARIA-E"
  - "ARIA-H"
  - "APOE ε4"
