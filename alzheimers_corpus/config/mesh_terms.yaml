# Alzheimer's disease MeSH scope.
# Version-controlled. Alzheimer Disease is the CENTRAL retrieval concept; every
# other tier is a supporting concept that must co-occur with an AD anchor.
# Terms are NOT simply OR-ed together - see alzheimers_corpus/config/corpus_config.yaml
# for the combination rules that preserve precision.
version: "0.1.0"
updated: "2026-09-11"
source_authority: "MS_Thesis_Proposal.pdf section 5.1 (MeSH scoping rule)"

tiers:

  primary:
    # The central concept. Presence of this alone establishes AD relevance.
    role: anchor
    requires_co_occurrence: false
    terms:
      - descriptor: "Alzheimer Disease"
        tree_numbers: ["C10.228.140.380.100", "F03.615.400.100"]
        explode: true

  clinical_context:
    # Supporting only. NEVER sufficient on its own - a generic dementia paper
    # with no AD anchor must not enter the corpus (see corpus_config exclusion_rules).
    role: supporting
    requires_co_occurrence: true
    terms:
      - descriptor: "Dementia"
        tree_numbers: ["C10.228.140.380", "F03.615.400"]
        explode: true
        note: "Broad. Included only with an AD anchor."
      - descriptor: "Cognitive Dysfunction"
        tree_numbers: ["F03.615.250"]
        explode: true
        note: "Covers MCI. Included only with an AD anchor."

  pathology:
    # AD pathology. Strong AD signal but not exclusive to AD, so co-occurrence
    # is required: amyloid research in other contexts is out of scope.
    role: supporting
    requires_co_occurrence: true
    terms:
      - descriptor: "Amyloid beta-Peptides"
        tree_numbers: ["D12.776.049.750.075"]
        explode: true
      - descriptor: "tau Proteins"
        tree_numbers: ["D12.776.631.892"]
        explode: true

  differential:
    # Comparator diseases. In scope ONLY where the work bears on AD differential
    # diagnosis - proposal 5.1 names these, and DDX is a required claim group.
    role: comparator
    requires_co_occurrence: true
    terms:
      - descriptor: "Lewy Body Disease"
        tree_numbers: ["C10.574.928"]
        explode: true
      - descriptor: "Frontotemporal Dementia"
        tree_numbers: ["C10.228.140.380.266.299"]
        explode: true

hierarchy_note: |
  Primary
  └── Alzheimer Disease                (anchor; sufficient alone)
  Clinical context
  ├── Dementia                         (supporting; needs anchor)
  └── Cognitive Dysfunction            (supporting; needs anchor)
  Alzheimer pathology
  ├── Amyloid beta-Peptides            (supporting; needs anchor)
  └── tau Proteins                     (supporting; needs anchor)
  Differential/comparator
  ├── Lewy Body Disease                (comparator; needs anchor)
  └── Frontotemporal Dementia          (comparator; needs anchor)
