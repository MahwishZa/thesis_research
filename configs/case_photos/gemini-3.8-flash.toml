# The gemini-3.8-flash settings of configs/multimodal/gemini-3.8-flash.toml, unchanged, on the case dataset (case_photos): only the case's published photos (one or several), with no text of the case.
# Setup, terms and notes: see configs/image/gemini-3.8-flash.toml.
# Do not edit this file after a test run has started: a changed setting is a new config file and a new run.
name = "gemini-3.8-flash"
dataset = "case_photos"  # the case dataset: data/cases/dataset.csv; results go to results/case_photos/<name>/

[model]
provider = "openai_compatible"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
extra_body = { provider = { order = ["google-ai-studio"], allow_fallbacks = false }, reasoning = { effort = "minimal" } }  # only Google AI Studio's standard route may answer; the least hidden reasoning, as thinking_level MINIMAL in the earlier Gemini config
id = "google/gemini-3.8-flash"
pinned = true  # the name has no date and OpenRouter gives no revision: Google serves one model under this name. Each answer records the model name and host that answered
temperature = 0.0  # as in the base paper (greedy decoding)
seed = 0           # best effort: the host may ignore it, so a repeated run can differ slightly
max_tokens = 2048  # hidden reasoning tokens may count toward this limit (at 64, a Gemini model once cut an answer to "basal")

[prompt]
file = "prompts/case_photos/diagnosis.txt"

[run]
requests_per_minute = 20  # well below a new account's limits; a rate-limit answer is retried after a wait
order_seed = 0            # seeded random order in which the cases are sent
