# The gpt-4o settings of configs/multimodal/gpt-4o.toml, unchanged, on the case dataset (case_photos): only the case's published photos (one or several), with no text of the case.
# Setup, terms and notes: see configs/image/gpt-4o.toml.
# Do not edit this file after a test run has started: a changed setting is a new config file and a new run.
name = "gpt-4o"
dataset = "case_photos"  # the case dataset: data/multimodal/cases.csv; results go to results/case_photos/<name>/

[model]
provider = "openai_compatible"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
extra_body = { provider = { order = ["openai"], allow_fallbacks = false } }  # only OpenAI's own host may answer (OpenRouter's other host for this model is Azure)
id = "openai/gpt-4o-2024-08-06"  # a dated snapshot, the "GPT-4" of the supervisor's list; the plain name "gpt-4o" moves. OpenAI has announced that GPT-4o leaves its API in January 2027; the version that answered is recorded with every answer
temperature = 0.0  # as in the base paper (greedy decoding)
seed = 0           # OpenAI treats the seed as best effort: a repeated run can still differ slightly
max_tokens = 64    # a class name needs about 12; room is left in case the model explains (an answer cut off is reported)
image_detail = "high"  # the picture is looked at in full detail instead of leaving it to "auto"

[prompt]
file = "prompts/case_photos/diagnosis.txt"

[run]
requests_per_minute = 20  # well below a new account's limits; a rate-limit answer is retried after a wait
order_seed = 0            # seeded random order in which the cases are sent
