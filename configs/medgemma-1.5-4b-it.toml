# Phase 1: MedGemma 1.5 4B-it (Google; Gemma 3 trained on medical text and images), zero-shot classification of one image into
# one of the dataset's classes. It runs on this computer through Hugging Face transformers (adapter hf_local), in the model's own
# bfloat16 (no compression) with greedy decoding, the temperature-0 setting of the base paper.
# Setup: PyTorch first (see requirements.txt), then requirements.txt; put HF_TOKEN=<token of an account that accepted the model's
# terms> in .env.
# Do not edit this file after a test run has started: a changed setting is a new config file and a new run.
name = "medgemma-1.5-4b-it"

[data]
root = "data"   # the extracted dataset, relative to the repository folder (git-ignored)
train = "Train" # training-split folder inside root
test = "Test"   # testing-split folder inside root
corrections = "results/dataset_profile/label_corrections.csv"  # ISIC-corrected testing labels: the report scores both label sets
manifest = "results/dataset_profile/manifest.csv"  # the profiled images (SHA-256); a run stops if the images on disk differ

[model]
provider = "hf_local"
id = "google/medgemma-1.5-4b-it"
revision = "91850547d9f0b2fdd21aa7c5f4f3d1a8a52c243b"  # the commit of the model files that `check` loaded on 2026-11-07; a test run needs one fixed commit, not "main"
dtype = "bfloat16"  # the model's own precision; float16 or float32 are also possible
seed = 0
max_new_tokens = 32  # every accepted answer fits: the longest, "Final answer: **Seborrheic Keratosis**.", is 11 word-pieces + 1 end token (counted 2026-11-07); a longer answer is not a class name
gpu_memory_gib = 3.0   # of the 4 GB graphics card, leaving room for the picture and the screen; the rest of the model waits in RAM
cpu_memory_gib = 10.0  # RAM the model may use for the part that does not fit on the card

[prompt]
# v2 is the one revision allowed after the first development run: it is judged only by the share of readable answers on the
# same development images (target 90%), never by accuracy, and is then frozen for the test run and every later model.
file = "prompts/diagnosis_v2.txt"

[run]
requests_per_minute = 600  # nothing to throttle: the model runs on this computer
dev_per_class = 10         # training images per class used only to develop the prompt
dev_seed = 0
order_seed = 0             # seeded random order in which the images are sent
max_image_side = 2048      # as for every model; MedGemma itself resizes every image to 896 x 896 pixels
