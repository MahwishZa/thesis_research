# The same model and settings as gpt-4o.toml, with a prompt that also offers the answer "uncertain" (abstention).
# Do not edit this file after a test run has started: a changed setting is a new config file and a new run.
name = "gpt-4o-abstain"
dataset = "image"  # the prepared dataset: data/image/; results go to results/image/<name>/

[model]
provider = "openai_compatible"
id = "gpt-4o-2024-08-06"  # a dated snapshot, the "GPT-4" of the supervisor's list; the plain name "gpt-4o" moves. OpenAI has announced that GPT-4o leaves its API in January 2027; the version that answered is recorded with every answer
temperature = 0.0  # as in the base paper (greedy decoding)
seed = 0           # OpenAI treats the seed as best effort: a repeated run can still differ slightly
max_tokens = 64    # a class name needs about 12; room is left in case the model explains (an answer cut off is reported)
image_detail = "high"  # the picture is looked at in full detail instead of leaving it to "auto"

[prompt]
file = "prompts/image/abstain.txt"
abstain = true  # the answer "uncertain" is offered; the model's other settings are the forced-choice run's

[run]
requests_per_minute = 20  # well below a new account's limits; a rate-limit answer is retried after a wait
order_seed = 0            # seeded random order in which the images are sent
