# Llama 4 Maverick (Meta) at OpenRouter, through its OpenAI-style API (adapter openai_compatible), on the image dataset. Meta offers
# no API of its own, and the older Llama 3.2 11B Vision Instruct is no longer served by any host (OpenRouter lists no host for
# it). Maverick replaces Llama 4 Scout, which wrote an explanation instead of a class name in 20% to 33% of its
# validation answers. The request is pinned to Parasail's fp8 route with no fallback, so no answer comes from another host or
# precision. Every image is sent to OpenRouter's servers and on to Parasail. Setup: put OPENROUTER_API_KEY=<your key> in .env
# (OpenRouter sells credit in advance). Every model gets the same images, prompt and answer reader; only [model] differs.
# Each answer records which host answered.
# Do not edit this file after a test run has started: a changed setting is a new config file and a new run.
name = "llama-4-maverick"
dataset = "image"  # the prepared dataset: data/image/; results go to results/image/<name>/

[model]
provider = "openai_compatible"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
extra_body = { provider = { order = ["parasail/fp8"], allow_fallbacks = false } }  # only Parasail's fp8 route may answer (Google Vertex, the other host, does not state its precision and is excluded)
id = "meta-llama/llama-4-maverick"
pinned = true  # the name has no date and OpenRouter gives no revision: the model is static, and the host and its fp8 precision are fixed above. Each answer records the model name and host that answered
temperature = 0.0  # as in the base paper (greedy decoding)
seed = 0           # best effort: the host may ignore it, so a repeated run can differ slightly
max_tokens = 256   # a class name needs about 12; room is left because this model may explain (an answer cut off is reported)

[prompt]
file = "prompts/image/diagnosis.txt"

[run]
requests_per_minute = 20  # well below a new account's limits; a rate-limit answer is retried after a wait
order_seed = 0            # seeded random order in which the images are sent
