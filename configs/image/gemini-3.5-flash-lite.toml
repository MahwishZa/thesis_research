# Gemini 3.5 Flash-Lite (Google) through the Gemini API on the free tier (adapter gemini). Every image is sent to Google's servers;
# on the free tier Google may use what is sent to improve its products (the researcher chose the free tier; the thesis states it).
# The current stable release, generally available since 2026-07-21; it replaces gemini-3.1-flash-lite (the earlier stable
# release) before any test run. An earlier trial of this model on the original test photos was set aside before the datasets were
# built. Setup: put GEMINI_API_KEY=<key from Google AI Studio> in .env. Every model gets the same images, prompt and answer
# reader; only [model] differs.
# Do not edit this file after a test run has started: a changed setting is a new config file and a new run.
name = "gemini-3.5-flash-lite"
dataset = "image"  # the prepared dataset: data/image/; results go to results/image/<name>/

[model]
provider = "gemini"
id = "gemini-3.5-flash-lite"  # a fixed model name, not a moving alias such as gemini-flash-lite-latest; Google reports the version with every answer
temperature = 0.0  # as in the base paper (greedy decoding); Google's default for Gemini 3 is 1.0
seed = 0
max_output_tokens = 2048  # thinking tokens count toward this limit (at 64, a Gemini model once cut an answer to "basal")
thinking_level = "MINIMAL"  # the least thinking, enough for simple classification; also LOW, MEDIUM, HIGH

[prompt]
file = "prompts/image/diagnosis.txt"

[run]
requests_per_minute = 5   # well below the free-tier per-minute limits; a daily limit stops the run, which continues when repeated
order_seed = 0            # seeded random order in which the images are sent
