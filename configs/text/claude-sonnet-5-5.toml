# Claude Sonnet 5.5 (Anthropic) through the Anthropic API (adapter anthropic), on the text dataset. Every case is sent to
# Anthropic's servers. Setup: put CLAUDE_API_KEY=<your key> in .env. Every model gets the same cases, prompt and answer
# reader; only [model] differs, and it is the same as in configs/image/claude-sonnet-5-5.toml.
# Do not edit this file after a test run has started: a changed setting is a new config file and a new run.
name = "claude-sonnet-5-5"
dataset = "text"  # the prepared dataset: data/text/; results go to results/text/<name>/

[model]
provider = "anthropic"
id = "claude-sonnet-5-5"  # the exact model id; Anthropic reports the version it served with every answer
max_tokens = 256          # a class name needs about 12; room is left in case the model reasons or explains (an answer cut off is reported)
thinking = "between_tools"  # no reasoning for a request without tools (Sonnet 5.5 refuses "disabled")
effort = "low"            # the lowest effort level
# temperature, top_p and top_k are not sent: the current Claude models reject them, so Anthropic's default sampling is used.

[prompt]
file = "prompts/text/diagnosis.txt"

[run]
requests_per_minute = 15  # low accounts have small per-minute token limits; a rate-limit answer is retried after a wait
order_seed = 0            # seeded random order in which the cases are sent
