# Packaging metadata. `pip install -e .` makes the active packages importable; the
# commands in README.md and docs/reproducibility.md are run from the repository root.
#
# The base install is numpy only: that is all the active code and the active test suite import at
# module level (checked by an import analysis on 2026-10-05). The heavy backends are imported lazily
# and come with the extras below. _archive/ is not listed: it is not an installable package and no
# active code imports it (enforced by evaluation/tests/unit/test_scope_invariants.py, which also
# checks that the package list below matches the active packages).
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-research"
version = "0.3.0"
description = "Retrieval-augmented medical question answering evaluated as of a date: an adapted RAG2 baseline and an evidence-criteria verification extension, on MedChangeQA (Cochrane questions whose verdict changed) with a held-out Alzheimer's disease and dementia test set."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# Figures of experiments/medchange/report.py (the tables need nothing extra).
report = ["matplotlib>=3.7"]
# MedCPT encoders and the Flan-T5 helpfulness/stance fallbacks. Not needed to run the test suite.
# NOTE: torch 2.4.x was built against numpy 1.x; if numpy 2.x is installed alongside it,
# pin numpy<2 (see docs/reproducibility.md).
models = ["torch>=2.0", "transformers>=4.40", "sentencepiece>=0.1.99"]
# Everything the MedChange pipeline needs end to end (PubMed probing needs only the
# standard library; llama-cpp-python is the CPU llama.cpp binding used for generation -
# on Windows install a prebuilt wheel, see docs/reproducibility.md).
medchange = [
    "torch>=2.0", "transformers>=4.40", "sentencepiece>=0.1.99",
    "llama-cpp-python>=0.2.60",
]
# Needed only to run the archived work (_archive/): the corpus scripts of the Alzheimer's framework
# (PyYAML, requests, pypdf) and the matched-pair scripts. The archived tests import these at module level.
archive = ["PyYAML>=6.0", "requests>=2.28", "pypdf>=3.0"]
# Used only by the archived RAG2 filter-reproduction attempt
# (_archive/rag2_filter_reproduction/): pick ONE of the two.
archive-filter-training-hf = [
    "torch>=2.0", "transformers>=4.40", "datasets>=2.14",
    "sentencepiece>=0.1.99", "accelerate>=0.30", "bitsandbytes>=0.43",
]
archive-filter-training-gguf = [
    "transformers>=4.40", "datasets>=2.14", "sentencepiece>=0.1.99",
    "llama-cpp-python>=0.2.60",
]

[tool.setuptools]
packages = [
    "src",
    "src.common",
    "src.temporal_filter",
    "evaluation",
    "experiments",
    "experiments.medchange",
]
