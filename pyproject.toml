# Packaging for the RAG² baseline. Install with `pip install -e .` from the repository root.
# The packages needed by each component of the baseline (docs/methodology.md) are optional extras,
# so that a component installs only what it uses.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-research"
version = "0.0.1"
description = "Improving RAG for medical question answering: a rebuild of the RAG2 baseline (Sohn et al., NAACL 2025), step by step."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Components 1 and 4: the language model that writes the rationale and the answer (llama.cpp), and the query encoder.
rationale = ["llama-cpp-python>=0.3.35", "numpy>=1.26", "torch>=2.4", "transformers>=4.51"]
# Component 2: the MedCPT article encoder and cross-encoder, and the search over the vectors;
# huggingface-hub downloads the guideline and textbook datasets.
retrieval = ["numpy>=1.26", "torch>=2.4", "transformers>=4.51", "huggingface-hub>=0.30"]
# Component 3: the Flan-T5 filter and its training.
filter = ["torch>=2.4", "transformers>=4.51", "tokenizers", "sentencepiece"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
