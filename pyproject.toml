# Packaging metadata. `pip install -e .` makes the active packages importable; the
# commands in README.md and docs/reproducibility.md are run from the repository root.
#
# _archive/ is not listed: it is not an installable package and no active code
# imports it (enforced by evaluation/tests/unit/test_scope_invariants.py).
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-research"
version = "0.2.0"
description = "Evidence-aware synthesis for retrieval-augmented medical question answering: does a stance-based synthesis layer, with optional recency and study-type weighting, improve verdicts on questions whose Cochrane conclusion changed? An as-of evaluation on MedChangeQA, with an Alzheimer's disease case study."
requires-python = ">=3.10"
# numpy is needed by experiments.shared.retrieval, which the test suite imports.
# requests (PubMed/PMC downloads) and pypdf (guideline PDFs) are imported at module level by
# corpus/scripts, whose functions the test suite exercises; without them 90 tests error on import.
dependencies = ["PyYAML>=6.0", "numpy>=1.24", "requests>=2.28", "pypdf>=3.0"]

[project.optional-dependencies]
# Real model backends. Not needed to run the test suite.
# NOTE: torch 2.4.x was built against numpy 1.x; if numpy 2.x is installed alongside it,
# pin numpy<2 (see docs/reproducibility.md).
models = ["torch>=2.0", "transformers>=4.40", "sentencepiece>=0.1.99"]
# Everything the MedChange pipeline needs end to end (PubMed probing needs only the
# standard library; llama-cpp-python is the CPU llama.cpp binding used for generation -
# on Windows install a prebuilt wheel, see docs/reproducibility.md).
medchange = [
    "torch>=2.0", "transformers>=4.40", "sentencepiece>=0.1.99",
    "llama-cpp-python>=0.2.60",
]
# Used only by the archived RAG2 filter-reproduction attempt
# (_archive/rag2_filter_reproduction/): pick ONE of the two.
archive-filter-training-hf = [
    "torch>=2.0", "transformers>=4.40", "datasets>=2.14",
    "sentencepiece>=0.1.99", "accelerate>=0.30", "bitsandbytes>=0.43",
]
archive-filter-training-gguf = [
    "transformers>=4.40", "datasets>=2.14", "sentencepiece>=0.1.99",
    "llama-cpp-python>=0.2.60",
]

[tool.setuptools]
packages = [
    "src",
    "src.common",
    "src.baseline",
    "src.proposed",
    "evaluation",
    "experiments",
    "experiments.medchange",
    "experiments.shared",
    "experiments.shared.questions",
    "experiments.shared.questions.sources",
    "experiments.shared.retrieval",
    "experiments.shared.runners",
]
