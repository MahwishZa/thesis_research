# The models, one entry each. A run is one model, one dataset and one approach:
#     python -m src.run run --model <name> --dataset <dataset> --approach closed_book --split test
# Every model gets the same questions, prompt (prompts/<dataset>/<approach>.txt) and answer reader on a dataset; only its entry
# differs. The settings are the same on every dataset. Do not edit an entry after a test run of the current answer format has used
# it: a changed setting is a new entry (another name) and a new run. (The first-phase runs of Version 1, in archive/v1/results/phase1/, asked for a class
# name alone, with smaller output limits; each run card records the settings it used.) Every image and case is sent to the provider's servers. API keys go in .env (never here).
#
# name                 the results folder: results/<dataset>/<approach>/<name>/
# requests_per_minute  the pace of the requests; a rate-limit answer is retried after a wait
# order_seed           the seeded random order in which the questions are sent
# [models.settings]    what the adapter sends: provider (anthropic or openai_compatible), the exact model id and its settings


# Claude Sonnet 5.5 (Anthropic) through the Anthropic API. Setup: CLAUDE_API_KEY=<your key> in .env.
[[models]]
name = "claude-sonnet-5-5"
requests_per_minute = 15  # low accounts have small per-minute token limits
order_seed = 0

[models.settings]
provider = "anthropic"
id = "claude-sonnet-5-5"  # the exact model id; Anthropic reports the version it served with every answer
max_tokens = 512          # the JSON answer (three classes, a flag, up to three sentences) needs about 250; an answer cut off is invalid and reported
thinking = "between_tools"  # no reasoning for a request without tools (Sonnet 5.5 refuses "disabled")
effort = "low"            # the lowest effort level
# temperature, top_p and top_k are not sent: the current Claude models reject them, so Anthropic's default sampling is used.


# GPT-4o (OpenAI) through OpenRouter's OpenAI-style API, pinned to OpenAI's own host with no fallback (the model is also offered
# through Azure). Setup: OPENROUTER_API_KEY=<your key> in .env (OpenRouter sells credit in advance). Each answer records the host.
[[models]]
name = "gpt-4o"
requests_per_minute = 20  # well below a new account's limits
order_seed = 0

[models.settings]
provider = "openai_compatible"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
extra_body = { provider = { order = ["openai"], allow_fallbacks = false } }  # only OpenAI's own host may answer
id = "openai/gpt-4o-2024-08-06"  # a dated snapshot; the plain name "gpt-4o" moves. OpenAI has announced that GPT-4o leaves its API in January 2027
temperature = 0.0  # as in the base paper (greedy decoding)
seed = 0           # OpenAI treats the seed as best effort: a repeated run can still differ slightly
max_tokens = 512   # the JSON answer needs about 250 (first phase: 64, for a class name alone); an answer cut off is invalid and reported
image_detail = "high"  # a picture is looked at in full detail instead of "auto"; nothing changes when no picture is sent


# Gemini 3.8 Flash (Google) through OpenRouter, pinned to Google AI Studio's standard route with no fallback (OpenRouter also
# lists Vertex, "flex" and "priority" routes). Setup: OPENROUTER_API_KEY=<your key> in .env. Each answer records the host.
[[models]]
name = "gemini-3.8-flash"
requests_per_minute = 20
order_seed = 0

[models.settings]
provider = "openai_compatible"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
extra_body = { provider = { order = ["google-ai-studio"], allow_fallbacks = false }, reasoning = { effort = "minimal" } }  # the least hidden reasoning
id = "google/gemini-3.8-flash"
pinned = true  # the name has no date and OpenRouter gives no revision: Google serves one model under this name
temperature = 0.0
seed = 0           # best effort: the host may ignore it, so a repeated run can differ slightly
max_tokens = 2048  # hidden reasoning tokens may count toward this limit (at 64, a Gemini model once cut an answer to "basal")


# Llama 4 Maverick (Meta) through OpenRouter, pinned to Parasail's fp8 route with no fallback (Meta offers no API of its own;
# Google Vertex, the other host, does not state its precision). Setup: OPENROUTER_API_KEY=<your key> in .env.
[[models]]
name = "llama-4-maverick"
requests_per_minute = 20
order_seed = 0

[models.settings]
provider = "openai_compatible"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
extra_body = { provider = { order = ["parasail/fp8"], allow_fallbacks = false } }  # only Parasail's fp8 route may answer
id = "meta-llama/llama-4-maverick"
pinned = true  # the name has no date and OpenRouter gives no revision: the model is static, and the host and precision are fixed above
temperature = 0.0
seed = 0
max_tokens = 512   # the JSON answer needs about 250; an answer cut off is invalid and reported
