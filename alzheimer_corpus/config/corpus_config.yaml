# Alzheimer's corpus configuration: inclusion logic, tiers, chunking, dates.
# Every rule here is configurable and transparent by design (spec section 32):
# the pipeline must be able to explain WHY any record was included or excluded.
version: "0.1.0"
corpus_version: "0.1.0"
updated: "2026-09-11"

corpus_identity:
  name: "AD-CORPUS"
  domain: "Alzheimer's disease"
  primary_concept: "Alzheimer Disease"
  scope_statement: >
    Scoped to Alzheimer's disease. Related dementia, cognitive and
    neurodegeneration concepts are SUPPORTING concepts only: they may qualify a
    record for inclusion when an Alzheimer's anchor is also present, and may
    never qualify one on their own. This prevents the corpus drifting into a
    generic dementia corpus.

# ---------------------------------------------------------------------------
# AD relevance decision (spec section 32). Implemented by
# alzheimer_corpus/scripts/classification/ad_relevance.py, which emits a full
# decision trace for every record. Thresholds are configurable, never implicit.
# ---------------------------------------------------------------------------
ad_relevance:
  # A record is AD-relevant if it satisfies at least one inclusion rule AND no
  # exclusion rule fires. Rules are evaluated in order; all matches are recorded.
  inclusion_rules:

    - id: R1_mesh_anchor
      description: "Alzheimer Disease MeSH descriptor present."
      weight: 1.0
      decisive: true

    - id: R2_title_anchor
      description: "An Alzheimer's disease term appears in the title."
      weight: 1.0
      decisive: true

    - id: R3_abstract_anchor
      description: "An Alzheimer's disease term appears in the abstract."
      weight: 0.8
      decisive: true

    - id: R4_pathology_with_anchor
      description: >
        Amyloid or tau pathology together with an Alzheimer's anchor. Pathology
        alone is NOT sufficient: amyloid research outside AD is out of scope.
      weight: 0.7
      decisive: false
      requires: [any_anchor]

    - id: R5_differential_with_anchor
      description: >
        A comparator disease (Lewy body disease, frontotemporal dementia,
        vascular cognitive impairment) together with an Alzheimer's anchor.
        Differential diagnosis is a required claim group, so AD-vs-X work is in
        scope; work on X alone is not.
      weight: 0.7
      decisive: false
      requires: [any_anchor]

  exclusion_rules:

    - id: X1_generic_dementia_only
      description: >
        Dementia / cognitive-impairment terminology present with NO Alzheimer's
        anchor anywhere in title, abstract or MeSH. This is the rule that stops
        the corpus becoming a generic dementia corpus.
      action: exclude
      reason_code: "generic_dementia_no_ad_anchor"

    - id: X2_comparator_only
      description: >
        A comparator disease (e.g. vascular dementia) with no Alzheimer's
        anchor. Example from the spec: a vascular dementia paper with no
        meaningful AD relevance is excluded despite containing "dementia".
      action: exclude
      reason_code: "comparator_disease_no_ad_anchor"

    - id: X3_ambiguous_abbreviation_only
      description: >
        The only evidence is the bare token "AD", with no long form anywhere in
        the record. "AD" also denotes atopic dermatitis, autosomal dominant and
        others, so it never establishes relevance alone.
      action: exclude
      reason_code: "ambiguous_abbreviation_only"

  # Minimum score to include. Any decisive rule sets the score to 1.0.
  min_score: 0.7
  # Records scoring below min_score are recorded with their trace, not dropped
  # silently - excluded documents remain auditable in the registry.
  retain_excluded_metadata: true

# ---------------------------------------------------------------------------
# Source tiers. Deliberately NOT ordered: evidence quality is claim-dependent,
# and authority ordering is a TESTED variable in the thesis (ablation A12).
# Assigning a rank here would prejudge that ablation.
# ---------------------------------------------------------------------------
source_tiers:
  ordering: null
  ordering_note: >
    No ordering is defined. Consumers must not infer one from list position.
  values:
    - clinical_guideline
    - consensus_statement
    - systematic_review
    - peer_reviewed_primary
    - clinical_trial
    - review
    - preprint
    - textbook
    - currency_pack

# ---------------------------------------------------------------------------
# Chunking. Proposal section 5.1 specifies 256 TOKENS / 32-token overlap sized
# against the article encoder's 512-token limit. The tokenizer is the downstream
# retrieval model's, never whitespace.
# ---------------------------------------------------------------------------
chunking:
  tokenizer: "ncbi/MedCPT-Article-Encoder"
  tokenizer_note: >
    Tokenizer only; model weights are not required for chunking.
  encoder_token_limit: 512
  chunk_size_tokens: 256
  overlap_tokens: 32
  stride_tokens: 224
  structure_aware_for:
    - clinical_guideline
    - consensus_statement
    - currency_pack
  structure_hierarchy: [document, section, subsection, paragraph, sentence]
  allow_size_exceptions: true
  exception_note: >
    A clinical recommendation must never be split from its qualifying
    conditions merely to hit 256 tokens. Exceptions are recorded per chunk in
    chunk_size_exception / chunk_size_exception_reason.

# ---------------------------------------------------------------------------
# Dates. Multiple dates are preserved; one is derived for corpus use, with the
# reason recorded. Precision is never invented.
# ---------------------------------------------------------------------------
dates:
  preserve:
    [date_published, date_online, date_issue, date_updated, date_corrected, date_retrieved]
  derived_field: date_used_for_corpus
  selection_order: [date_online, date_published, date_issue]
  selection_note: >
    Earliest real publication event, electronic first, excluding preprint dates.
    PROVISIONAL - the proposal says only "publication date" and does not
    distinguish online-first from print.
  precision_values: [day, month, year]
  never_upgrade_precision: true
  report_missing_rate_by_source: true

# ---------------------------------------------------------------------------
# Retractions: flagged, never silently deleted. Retracted records must remain
# retrievable so that rejection at admission can be measured.
# ---------------------------------------------------------------------------
retraction_handling:
  flags: [retracted, withdrawn, expression_of_concern, corrected]
  delete_retracted: false
  derive_field: usable_for_evidence

# ---------------------------------------------------------------------------
# Licensing. Nothing enters the distributable corpus without a positive
# redistribution determination.
# ---------------------------------------------------------------------------
licensing:
  required_fields:
    [source, source_id, title, source_url, license, license_url,
     reuse_status, redistribution_allowed, retrieval_date]
  default_redistribution_allowed: false
  default_note: >
    Fail closed. A record with unknown licence is treated as NOT
    redistributable and its text is not committed.
  distributable_licenses:
    [CC0, CC-BY, CC-BY-SA, CC-BY-NC, CC-BY-NC-SA, CC-BY-ND, public-domain, us-government-work]
  metadata_only_if_restricted: true
