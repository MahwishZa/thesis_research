# Alzheimer's claim taxonomy.
# `keywords` are intentionally EMPTY: populating them is assignment-mechanism work
# and is gated on the open decisions listed below.
version: 1.0.0
updated: '2026-09-11'
taxonomy_id: AD-CLAIM-CLASS
derived_from: The eleven topics the thesis proposal names in section 5.1, subdivided by the granularity
  rule below. Not derived from any pre-existing label set.
granularity_rule: A class must be fine enough that two passages sharing it make claims about the SAME
  clinical decision, and coarse enough that an update and the thing it updates share one class. This follows
  from the contested test, which fires on same-class opposition, and from gamma, which supersedes per
  class.
multi_label: true
multi_label_note: A passage may carry several classes. Single- vs multi-label is an open decision.
classification_is_not_a_delete_filter: true
classification_note: 'Claim class drives retrieval ranking, down-weighting and review. It MUST NOT delete
  documents: gamma down-weights rather than deletes precisely because tagging precision is unverified.'
open_decisions:
- granularity level (group vs leaf) - determines whether the contested state can fire
- multi-label vs single-label
- psi(q) time-invariance flag per class
- whether keywords are hand-written or learned
explicitly_not_defined:
- source tier / authority ordering - authority is a tested variable (ablation A12)
counts:
  groups: 9
  classes: 50
  REQUIRED: 40
  DESIRABLE: 10
