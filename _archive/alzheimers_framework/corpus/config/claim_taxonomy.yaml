# config/claim_taxonomy.yaml
#
# Purpose:
#   Define the scientific claim categories used by the Alzheimer corpus
#   during claim extraction, classification, annotation, and evaluation.
#
# Important:
#   This taxonomy describes CLAIM TYPE.
#   It does not determine whether a claim is true, false, current, or outdated.
#   Evidence status and temporal status are separate dimensions.

version: "1.0"

project:
  name: "Alzheimer Disease Evidence Corpus"
  scope:
    primary_disease:
      - "Alzheimer Disease"

    related_dementias:
      - "Lewy body dementia"
      - "Frontotemporal dementia"
      - "Frontotemporal lobar degeneration"
      - "Other dementias used for differential diagnosis"

  principle:
    - "Claims must be classified by their scientific function."
    - "Disease relevance and claim type are separate dimensions."
    - "Related dementias must not automatically be treated as Alzheimer Disease evidence."
    - "Temporal status must be represented separately from claim type."
    - "Evidence quality must be represented separately from claim type."

# ---------------------------------------------------------------------------
# PRIMARY CLAIM TAXONOMY
# ---------------------------------------------------------------------------

claim_types:

  disease_definition:
    label: "Disease definition"
    description: >
      Claims describing what Alzheimer Disease is, including its biological,
      pathological, clinical, or conceptual definition.
    subtypes:
      - biological_definition
      - pathological_definition
      - clinical_definition
      - disease_spectrum
      - disease_etiology
      - disease_mechanism

  epidemiology:
    label: "Epidemiology"
    description: >
      Claims describing disease frequency, prevalence, incidence, mortality,
      demographics, risk distribution, or population burden.
    subtypes:
      - prevalence
      - incidence
      - mortality
      - demographic_distribution
      - disease_burden
      - population_risk

  risk_factor:
    label: "Risk factor"
    description: >
      Claims describing factors associated with increased or decreased risk
      of developing Alzheimer Disease or related outcomes.
    subtypes:
      - genetic_risk
      - demographic_risk
      - lifestyle_risk
      - vascular_risk
      - environmental_risk
      - protective_factor
      - modifiable_risk
      - nonmodifiable_risk

  diagnosis:
    label: "Diagnosis"
    description: >
      Claims concerning the identification or diagnosis of Alzheimer Disease,
      including diagnostic approaches, criteria, tests, and diagnostic accuracy.
    subtypes:
      - diagnostic_criteria
      - diagnostic_workup
      - clinical_diagnosis
      - laboratory_diagnosis
      - imaging_diagnosis
      - diagnostic_accuracy
      - sensitivity
      - specificity
      - positive_predictive_value
      - negative_predictive_value

  staging:
    label: "Disease staging"
    description: >
      Claims describing disease stages, severity categories, progression
      states, or transitions between clinical or biological stages.
    subtypes:
      - preclinical
      - subjective_cognitive_decline
      - mild_cognitive_impairment
      - dementia_stage
      - severity
      - disease_progression_stage
      - biomarker_stage

  prognosis:
    label: "Prognosis"
    description: >
      Claims about expected disease progression, clinical outcomes, survival,
      conversion, or future disease trajectory.
    subtypes:
      - progression
      - conversion
      - cognitive_decline
      - functional_decline
      - survival
      - mortality_risk
      - prognostic_factor
      - prognostic_biomarker

  pathology:
    label: "Neuropathology"
    description: >
      Claims describing pathological features and biological processes
      characteristic of Alzheimer Disease.
    subtypes:
      - amyloid_pathology
      - tau_pathology
      - neurofibrillary_tangles
      - amyloid_plaques
      - neurodegeneration
      - synaptic_dysfunction
      - neuronal_loss
      - neuroinflammation
      - vascular_pathology

  biomarker:
    label: "Biomarker"
    description: >
      Claims concerning biomarkers used for detection, diagnosis, staging,
      prognosis, monitoring, or biological characterization of Alzheimer Disease.
    subtypes:
      - biomarker_definition
      - biomarker_association
      - diagnostic_biomarker
      - prognostic_biomarker
      - monitoring_biomarker
      - predictive_biomarker
      - fluid_biomarker
      - plasma_biomarker
      - csf_biomarker
      - imaging_biomarker
      - molecular_biomarker

  amyloid:
    label: "Amyloid"
    description: >
      Claims specifically concerning amyloid-beta biology, deposition,
      measurement, clearance, or amyloid-targeting strategies.
    subtypes:
      - amyloid_biology
      - amyloid_deposition
      - amyloid_biomarker
      - amyloid_pet
      - amyloid_clearance
      - amyloid_targeting

  tau:
    label: "Tau"
    description: >
      Claims specifically concerning tau biology, phosphorylation,
      aggregation, spread, measurement, or tau-related pathology.
    subtypes:
      - tau_biology
      - phosphorylated_tau
      - tau_aggregation
      - tau_spread
      - tau_biomarker
      - tau_imaging

  genetics:
    label: "Genetics"
    description: >
      Claims concerning genetic variants, genes, inheritance, genetic risk,
      or genetic modifiers of Alzheimer Disease.
    subtypes:
      - genetic_association
      - genetic_risk
      - susceptibility_gene
      - protective_variant
      - pathogenic_variant
      - inheritance
      - gene_environment_interaction

  apoe:
    label: "APOE"
    description: >
      Claims specifically concerning APOE genotype, especially APOE epsilon
      variants and their association with Alzheimer Disease risk or treatment.
    subtypes:
      - apoe_risk
      - apoe_genotype
      - apoe_treatment_response
      - apoe_aria_risk
      - apoe_prognosis

  imaging:
    label: "Imaging"
    description: >
      Claims concerning neuroimaging methods or imaging-derived measures
      relevant to Alzheimer Disease.
    subtypes:
      - mri
      - ct
      - fdg_pet
      - amyloid_pet
      - tau_pet
      - structural_imaging
      - functional_imaging
      - molecular_imaging
      - imaging_accuracy
      - imaging_monitoring

  differential_diagnosis:
    label: "Differential diagnosis"
    description: >
      Claims distinguishing Alzheimer Disease from other neurological,
      neurodegenerative, psychiatric, or medical conditions.
    subtypes:
      - alzheimer_vs_lbd
      - alzheimer_vs_ftd
      - alzheimer_vs_ftld
      - alzheimer_vs_vascular_dementia
      - alzheimer_vs_other_dementia
      - clinical_differentiation
      - biomarker_differentiation
      - imaging_differentiation

  treatment:
    label: "Treatment"
    description: >
      Claims concerning interventions intended to treat, slow, prevent,
      or modify Alzheimer Disease.
    subtypes:
      - pharmacological_treatment
      - nonpharmacological_treatment
      - disease_modifying_treatment
      - symptomatic_treatment
      - preventive_treatment
      - combination_treatment

  treatment_efficacy:
    label: "Treatment efficacy"
    description: >
      Claims concerning the effectiveness or clinical benefit of an
      intervention.
    subtypes:
      - cognitive_outcome
      - functional_outcome
      - clinical_outcome
      - disease_progression
      - biomarker_outcome
      - quality_of_life
      - mortality_outcome
      - treatment_response
      - comparative_efficacy

  treatment_safety:
    label: "Treatment safety"
    description: >
      Claims concerning adverse events, risks, tolerability, contraindications,
      or safety monitoring associated with treatment.
    subtypes:
      - adverse_event
      - serious_adverse_event
      - adverse_drug_reaction
      - contraindication
      - drug_interaction
      - safety_monitoring
      - treatment_risk

  anti_amyloid_therapy:
    label: "Anti-amyloid therapy"
    description: >
      Claims concerning therapies designed to reduce or modify amyloid
      pathology.
    subtypes:
      - lecanemab
      - donanemab
      - other_anti_amyloid_antibody
      - amyloid_clearance
      - disease_modification
      - clinical_benefit
      - treatment_response

  aria:
    label: "ARIA"
    description: >
      Claims concerning amyloid-related imaging abnormalities and their
      detection, risk, management, monitoring, or clinical significance.
    subtypes:
      - aria_e
      - aria_h
      - aria_risk
      - aria_detection
      - aria_monitoring
      - aria_management
      - aria_severity
      - aria_apoe_association

  eligibility:
    label: "Treatment or diagnostic eligibility"
    description: >
      Claims specifying which patients are appropriate or inappropriate
      candidates for an intervention, test, or diagnostic pathway.
    subtypes:
      - treatment_eligibility
      - biomarker_eligibility
      - diagnostic_eligibility
      - disease_stage_eligibility
      - amyloid_status_eligibility
      - safety_eligibility
      - exclusion_criteria

  monitoring:
    label: "Monitoring"
    description: >
      Claims concerning monitoring disease status, treatment response,
      biomarkers, adverse events, or disease progression.
    subtypes:
      - disease_monitoring
      - treatment_monitoring
      - biomarker_monitoring
      - imaging_monitoring
      - safety_monitoring
      - longitudinal_monitoring

  guidelines_and_consensus:
    label: "Guidelines and consensus"
    description: >
      Claims representing recommendations, consensus statements, clinical
      practice guidance, or expert recommendations.
    subtypes:
      - clinical_guideline
      - consensus_statement
      - practice_recommendation
      - diagnostic_recommendation
      - treatment_recommendation
      - monitoring_recommendation
      - eligibility_recommendation

  systematic_evidence:
    label: "Systematic evidence"
    description: >
      Claims derived from systematic reviews, meta-analyses, evidence
      syntheses, or other structured evidence summaries.
    subtypes:
      - systematic_review
      - meta_analysis
      - pooled_analysis
      - evidence_synthesis

  mechanism:
    label: "Mechanism"
    description: >
      Claims explaining biological, molecular, cellular, physiological,
      or pathological mechanisms related to Alzheimer Disease.
    subtypes:
      - molecular_mechanism
      - cellular_mechanism
      - pathological_mechanism
      - inflammatory_mechanism
      - vascular_mechanism
      - neurodegenerative_mechanism

  association:
    label: "Association"
    description: >
      Claims reporting a relationship between two or more variables without
      necessarily establishing causation.
    subtypes:
      - observational_association
      - biomarker_association
      - genetic_association
      - clinical_association
      - imaging_association
      - epidemiological_association

  causation:
    label: "Causation"
    description: >
      Claims asserting that one factor causes, contributes to, mediates,
      prevents, or modifies another outcome.
    subtypes:
      - causal_relationship
      - causal_mechanism
      - mediation
      - modification
      - prevention

# ---------------------------------------------------------------------------
# CLAIM STATUS
# This is intentionally separate from claim type.
# ---------------------------------------------------------------------------

claim_status:
  - supported
  - contradicted
  - uncertain
  - insufficient_evidence

# ---------------------------------------------------------------------------
# TEMPORAL STATUS
# Also separate from claim type.
# ---------------------------------------------------------------------------

temporal_status:
  - current
  - historical
  - superseded
  - emerging
  - uncertain

# ---------------------------------------------------------------------------
# EVIDENCE LEVEL
# Describes the source/evidence context, not the scientific claim itself.
# ---------------------------------------------------------------------------

evidence_levels:
  primary_research:
    - randomized_controlled_trial
    - cohort_study
    - case_control_study
    - cross_sectional_study
    - diagnostic_accuracy_study
    - observational_study
    - basic_science_study

  secondary_research:
    - systematic_review
    - meta_analysis
    - narrative_review
    - evidence_synthesis

  authoritative:
    - clinical_guideline
    - consensus_statement
    - regulatory_document
    - professional_society_statement

  reference:
    - textbook
    - reference_work

# ---------------------------------------------------------------------------
# REQUIRED CLAIM RECORD FIELDS
# ---------------------------------------------------------------------------

claim_record:
  required_fields:
    - claim_id
    - claim_text
    - claim_type
    - source_id
    - evidence_span

  recommended_fields:
    - claim_subtype
    - disease
    - population
    - intervention
    - comparator
    - outcome
    - biomarker
    - evidence_level
    - claim_status
    - temporal_status
    - publication_year
    - source_query
    - pmid
    - pmcid

# ---------------------------------------------------------------------------
# DISEASE RELEVANCE
# ---------------------------------------------------------------------------

disease_relevance:
  primary:
    - alzheimer_disease

  related:
    - dementia
    - lewy_body_dementia
    - frontotemporal_dementia
    - frontotemporal_lobar_degeneration
    - vascular_dementia
    - other_dementia

  exclusion:
    - unrelated_condition
    - insufficient_disease_relevance